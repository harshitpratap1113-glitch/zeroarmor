[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroarmor"
version = "2.0.0"
authors = [
  { name="ZeroArmor Cyber Defense Labs", email="security@zeroarmor.dev" },
]
description = "ZeroArmor Titanium: 32-Vector 1-Line Runtime Application Self-Protection (RASP) Shield."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.scripts]
zeroarmor = "zeroarmor.cli:main"

[project.urls]
"Homepage" = "https://github.com/harshitpratap1113-glitch/zeroarmor"
"Bug Tracker" = "https://github.com/harshitpratap1113-glitch/zeroarmor/issues"
